<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advent School Boca — Interactive Kiosk</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1628;
    --navy-mid: #112240;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-dim: #7a6130;
    --white: #f5f0e8;
    --white-dim: rgba(245,240,232,0.6);
    --white-faint: rgba(245,240,232,0.08);
    --accent: #1e6b9e;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Lato',sans-serif; background:var(--navy); color:var(--white); width:100vw; height:100vh; overflow:hidden; cursor:pointer; }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; }
  .screen.active { display:flex; }

  /* HOME */
  #home { background:radial-gradient(ellipse at 60% 40%, #1a3a6b 0%, #0a1628 60%); align-items:center; justify-content:center; text-align:center; }
  .home-bg-cross { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0.04; pointer-events:none; }
  .home-bg-cross svg { width:70vh; height:70vh; }
  .gold-rule { width:120px; height:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:18px auto; }
  .home-eyebrow { font-family:'Lato',sans-serif; font-weight:300; font-size:0.75rem; letter-spacing:0.35em; text-transform:uppercase; color:var(--gold); animation:fadeUp 1s ease both; }
  .home-school { font-family:'Cinzel',serif; font-size:clamp(2rem,5vw,3.8rem); font-weight:700; color:var(--white); line-height:1.1; letter-spacing:0.05em; animation:fadeUp 1s 0.2s ease both; }
  .home-tagline { font-size:0.85rem; letter-spacing:0.2em; color:var(--white-dim); font-weight:300; animation:fadeUp 1s 0.35s ease both; }
  .home-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; width:min(92vw,960px); margin-top:32px; animation:fadeUp 1s 0.6s ease both; }
  .tile { background:var(--white-faint); border:1px solid rgba(201,168,76,0.2); border-radius:12px; padding:22px 14px 18px; display:flex; flex-direction:column; align-items:center; gap:10px; transition:background 0.25s,border-color 0.25s,transform 0.2s; position:relative; overflow:hidden; }
  .tile::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(201,168,76,0.08) 0%,transparent 60%); opacity:0; transition:opacity 0.25s; }
  .tile:hover,.tile:active { background:rgba(201,168,76,0.12); border-color:rgba(201,168,76,0.5); transform:translateY(-3px); }
  .tile:hover::before { opacity:1; }
  .tile-icon { font-size:2rem; line-height:1; }
  .tile-label { font-family:'Cinzel',serif; font-size:0.65rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold-light); text-align:center; line-height:1.4; }
  .home-touch-hint { font-size:0.7rem; letter-spacing:0.2em; color:rgba(245,240,232,0.3); text-transform:uppercase; margin-top:28px; animation:pulse 3s infinite; }

  /* SECTION */
  #section-screen { background:var(--navy); }
  .section-header { background:linear-gradient(180deg,#0d1e3d 0%,#0a1628 100%); border-bottom:1px solid rgba(201,168,76,0.25); padding:18px 36px; display:flex; align-items:center; gap:20px; flex-shrink:0; }
  .back-btn { background:rgba(201,168,76,0.12); border:1px solid rgba(201,168,76,0.35); color:var(--gold-light); font-family:'Lato',sans-serif; font-size:0.75rem; letter-spacing:0.15em; text-transform:uppercase; padding:10px 20px; border-radius:6px; cursor:pointer; transition:background 0.2s; flex-shrink:0; }
  .back-btn:hover { background:rgba(201,168,76,0.22); }
  .section-title-wrap { flex:1; }
  .section-title-wrap h2 { font-family:'Cinzel',serif; font-size:1.5rem; color:var(--white); letter-spacing:0.08em; }
  .section-subtitle { font-size:0.72rem; letter-spacing:0.2em; color:var(--gold); text-transform:uppercase; margin-top:2px; }
  .section-body { flex:1; overflow-y:auto; padding:28px 36px; scrollbar-width:thin; scrollbar-color:var(--gold-dim) transparent; }

  /* LOADING */
  .loading-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:200px; gap:16px; }
  .spinner { width:36px; height:36px; border:3px solid rgba(201,168,76,0.2); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; }
  .loading-text { font-size:0.75rem; letter-spacing:0.2em; color:var(--white-dim); text-transform:uppercase; }
  .error-state { text-align:center; padding:40px; color:var(--white-dim); font-size:0.85rem; line-height:1.8; }
  .error-state strong { color:var(--gold); display:block; margin-bottom:8px; font-family:'Cinzel',serif; }

  /* CARDS */
  .cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:18px; }
  .card { background:var(--white-faint); border:1px solid rgba(201,168,76,0.15); border-radius:12px; overflow:hidden; cursor:pointer; transition:transform 0.2s,border-color 0.2s,box-shadow 0.2s; }
  .card:hover { transform:translateY(-4px); border-color:rgba(201,168,76,0.5); box-shadow:0 12px 40px rgba(0,0,0,0.4); }
  .card-img { width:100%; aspect-ratio:1/1; object-fit:cover; background:linear-gradient(135deg,#1a3a6b,#0d1e3d); display:flex; align-items:center; justify-content:center; font-size:3rem; color:var(--gold-dim); overflow:hidden; }
  .card-img img { width:100%; height:100%; object-fit:cover; }
  .card-body { padding:14px 16px; }
  .card-name { font-family:'Cinzel',serif; font-size:0.85rem; color:var(--white); margin-bottom:4px; }
  .card-meta { font-size:0.72rem; color:var(--gold); letter-spacing:0.08em; margin-bottom:6px; }
  .card-desc { font-size:0.72rem; color:var(--white-dim); line-height:1.55; }

  /* DETAIL */
  #detail-overlay { position:fixed; inset:0; background:rgba(5,12,28,0.92); backdrop-filter:blur(8px); display:none; align-items:center; justify-content:center; z-index:100; padding:40px; animation:fadeIn 0.3s ease; }
  #detail-overlay.open { display:flex; }
  .detail-card { background:linear-gradient(160deg,#112240,#0a1628); border:1px solid rgba(201,168,76,0.35); border-radius:18px; width:min(680px,100%); max-height:80vh; overflow-y:auto; padding:36px; position:relative; animation:scaleUp 0.3s ease; }
  .detail-close { position:absolute; top:18px; right:18px; background:rgba(201,168,76,0.15); border:1px solid rgba(201,168,76,0.3); color:var(--gold-light); font-size:1rem; width:36px; height:36px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.2s; }
  .detail-close:hover { background:rgba(201,168,76,0.3); }
  .detail-img { width:100%; max-height:340px; object-fit:contain; border-radius:10px; margin-bottom:18px; background:linear-gradient(135deg,#1a3a6b,#0d1e3d); }
  .detail-emoji { font-size:3rem; margin-bottom:12px; }
  .detail-name { font-family:'Cinzel',serif; font-size:1.6rem; color:var(--white); margin-bottom:6px; }
  .detail-badge { display:inline-block; background:rgba(201,168,76,0.15); border:1px solid rgba(201,168,76,0.4); color:var(--gold-light); font-size:0.7rem; letter-spacing:0.15em; text-transform:uppercase; padding:4px 12px; border-radius:20px; margin-bottom:18px; }
  .detail-body { font-size:0.88rem; color:var(--white-dim); line-height:1.75; }
  .detail-verse { margin-top:20px; padding-top:16px; border-top:1px solid rgba(201,168,76,0.2); font-style:italic; color:var(--gold-dim); font-size:0.8rem; }

  /* EVENTS */
  .events-list { display:flex; flex-direction:column; gap:14px; }
  .event-row { background:var(--white-faint); border:1px solid rgba(201,168,76,0.15); border-radius:10px; padding:18px 22px; display:flex; gap:20px; align-items:center; transition:border-color 0.2s,background 0.2s; }
  .event-row:hover { border-color:rgba(201,168,76,0.4); background:rgba(201,168,76,0.07); }
  .event-date { text-align:center; flex-shrink:0; width:52px; }
  .event-month { font-size:0.62rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold); }
  .event-day { font-family:'Cinzel',serif; font-size:1.8rem; color:var(--white); line-height:1; }
  .event-info h4 { font-family:'Cinzel',serif; font-size:0.9rem; color:var(--white); margin-bottom:4px; }
  .event-info p { font-size:0.75rem; color:var(--white-dim); }
  .event-tag { margin-left:auto; font-size:0.65rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold-light); background:rgba(201,168,76,0.12); border:1px solid rgba(201,168,76,0.25); padding:4px 10px; border-radius:20px; flex-shrink:0; }

  /* DONORS */
  .donor-tier { margin-bottom:32px; }
  .donor-tier-label { font-family:'Cinzel',serif; font-size:0.7rem; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold); margin-bottom:12px; display:flex; align-items:center; gap:12px; }
  .donor-tier-label::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,rgba(201,168,76,0.3),transparent); }
  .donor-names { display:flex; flex-wrap:wrap; gap:10px; }
  .donor-chip { background:var(--white-faint); border:1px solid rgba(201,168,76,0.18); border-radius:6px; padding:10px 18px; font-size:0.82rem; color:var(--white); transition:background 0.2s,border-color 0.2s; }
  .donor-chip:hover { background:rgba(201,168,76,0.1); border-color:rgba(201,168,76,0.4); }
  .donor-chip.Platinum,.donor-chip.platinum { border-color:rgba(180,220,255,0.4); color:#cce8ff; background:rgba(180,220,255,0.06); }
  .donor-chip.Gold,.donor-chip.gold { border-color:rgba(201,168,76,0.5); color:var(--gold-light); background:rgba(201,168,76,0.1); }
  .donor-chip.Silver,.donor-chip.silver { border-color:rgba(192,192,192,0.4); color:#ddd; background:rgba(192,192,192,0.06); }

  /* CATEGORY BUTTONS */
  .cat-btn { background:var(--white-faint); border:1px solid rgba(201,168,76,0.2); border-radius:20px; padding:10px 18px; font-family:'Cinzel',serif; font-size:0.65rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold-light); cursor:pointer; transition:background 0.2s,border-color 0.2s,transform 0.15s; }
  .cat-btn:hover { background:rgba(201,168,76,0.15); border-color:rgba(201,168,76,0.5); transform:translateY(-2px); }
  .cat-btn-active { background:rgba(201,168,76,0.25); border-color:rgba(201,168,76,0.7); color:var(--white); }

  /* ANIMATIONS */
  @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes scaleUp { from{opacity:0;transform:scale(0.92)} to{opacity:1;transform:scale(1)} }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:0.7} }
  @keyframes spin { to{transform:rotate(360deg)} }
  ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:2px}
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════
//  CONFIGURATION — UPDATE THIS WITH YOUR SHEET ID
// ═══════════════════════════════════════════════════════
const SHEET_ID = '1UvieFX_Sgu6eye2k8DU-gwol_wByfkbC_646yYD8YcM';

// Tab names must match exactly what you name your sheet tabs
const TABS = {
  donors:    'Donors',
  sports:    'Sports',
  academics: 'Academics',
  faith:     'Faith',
  faculty:   'Faculty',
  events:    'Events',
  students:  'Students',
  store:     'Store'
};

const SECTION_META = {
  donors:    { title:'Donors & Benefactors',     subtitle:'With gratitude for those who invest in our mission' },
  sports:    { title:'Gator Sports',             subtitle:'Honoring our Gators — champions on and off the field' },
  academics: { title:'Academic Awards',          subtitle:'Celebrating excellence in scholarship and learning' },
  faith:     { title:'Faith & Character Awards', subtitle:'Honoring those who reflect Christ in word and deed' },
  faculty:   { title:'Faculty Spotlights',       subtitle:'The dedicated educators shaping hearts and minds' },
  events:    { title:'Upcoming Events',          subtitle:'Mark your calendar — all are welcome' },
  students:  { title:'Student Recognition',      subtitle:'Every child made in His image, every achievement worth celebrating' },
  store:     { title:'School Store',             subtitle:'Advent Gators gear and school supplies' }
};

// Cache so we don't re-fetch on every visit
const cache = {};

// ═══════════════════════════════════════════════════════
//  FETCH FROM GOOGLE SHEETS (published CSV)
// ═══════════════════════════════════════════════════════
async function fetchSheet(tabName) {
  if (cache[tabName]) return cache[tabName];
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabName)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Could not load ${tabName} tab`);
  const text = await res.text();
  const rows = parseCSV(text);
  cache[tabName] = rows;
  return rows;
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase().trim());
  return lines.slice(1).map(line => {
    const vals = parseCSVLine(line);
    const obj = {};
    headers.forEach((h, i) => obj[h] = (vals[i] || '').trim());
    return obj;
  }).filter(r => Object.values(r).some(v => v));
}

function parseCSVLine(line) {
  const result = [];
  let cur = '', inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuote && line[i+1] === '"') { cur += '"'; i++; }
      else inQuote = !inQuote;
    } else if (ch === ',' && !inQuote) {
      result.push(cur); cur = '';
    } else cur += ch;
  }
  result.push(cur);
  return result;
}

// ═══════════════════════════════════════════════════════
//  RENDERERS — one per section
// ═══════════════════════════════════════════════════════
function renderDonors(rows) {
  const tiers = {};
  rows.forEach(r => {
    const t = r.tier || 'General';
    if (!tiers[t]) tiers[t] = [];
    tiers[t].push(r);
  });
  const tierOrder = ['Platinum','Gold','Silver','General'];
  const sorted = [...new Set([...tierOrder, ...Object.keys(tiers)])].filter(t => tiers[t]);
  return sorted.map(tier => `
    <div class="donor-tier">
      <div class="donor-tier-label">✦ ${tier} ${tier !== 'General' ? '— ' + getTierLabel(tier) : ''}</div>
      <div class="donor-names">
        ${tiers[tier].map(r => `<div class="donor-chip ${tier.toLowerCase()}">${r.name}</div>`).join('')}
      </div>
    </div>
  `).join('') + `<p style="font-size:0.72rem;color:rgba(245,240,232,0.35);margin-top:24px;font-style:italic;">To learn about giving opportunities, please speak with our office staff.</p>`;
}

function getTierLabel(t) {
  return {Platinum:'Legacy Partners', Gold:'Cornerstone Givers', Silver:'Faithful Supporters'}[t] || '';
}

function renderCards(rows, sectionKey) {
  return `<div class="cards-grid">${rows.map((r, i) => `
    <div class="card" onclick="openDetail('${sectionKey}', ${i})">
      <div class="card-img">
        ${r.photo ? `<img src="${fixPhotoUrl(r.photo)}" alt="${r.name}" onerror="this.parentElement.innerHTML='${getDefaultIcon(sectionKey)}'">` : getDefaultIcon(sectionKey)}
      </div>
      <div class="card-body">
        <div class="card-name">${r.name}</div>
        <div class="card-meta">${r.meta || r.grade || r.year || r.subject || ''}</div>
        <div class="card-desc">${(r.description || r.bio || r.desc || '').substring(0,90)}…</div>
      </div>
    </div>
  `).join('')}</div>`;
}

function renderEvents(rows) {
  return `<div class="events-list">${rows.map(r => {
    const d = r.date ? new Date(r.date) : null;
    const month = d ? d.toLocaleString('default',{month:'short'}).toUpperCase() : r.month || '—';
    const day   = d ? d.getDate() : r.day || '—';
    return `
      <div class="event-row">
        <div class="event-date">
          <div class="event-month">${month}</div>
          <div class="event-day">${day}</div>
        </div>
        <div class="event-info">
          <h4>${r.title || r.name}</h4>
          <p>${r.description || r.desc || ''}</p>
        </div>
        <div class="event-tag">${r.tag || r.category || 'Event'}</div>
      </div>`;
  }).join('')}</div>`;
}

function renderStore(rows) {
  return renderCards(rows, 'store');
}

function fixPhotoUrl(url) {
  if (!url) return '';
  // Handle Google Drive share links
  const driveMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (driveMatch) {
    return `https://lh3.googleusercontent.com/d/${driveMatch[1]}`;
  }
  // Handle already-converted uc?id= links
  const ucMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (ucMatch) {
    return `https://lh3.googleusercontent.com/d/${ucMatch[1]}`;
  }
  return url;
}

const FACULTY_CATEGORIES = [
  'School Administration',

];

function renderFacultyCategories(rows, activeCategory) {
  const cats = FACULTY_CATEGORIES;
  const catButtons = `
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px;">
      <div class="cat-btn ${!activeCategory ? 'cat-btn-active' : ''}" onclick="showFacultyCategory(null)">All Staff</div>
      ${cats.map(c => `<div class="cat-btn ${activeCategory===c ? 'cat-btn-active' : ''}" onclick="showFacultyCategory('${c}')">${c}</div>`).join('')}
    </div>`;

  const filtered = activeCategory ? rows.filter(r => (r.category||'').toLowerCase().trim() === activeCategory.toLowerCase().trim()) : rows;

  const cards = filtered.length > 0
    ? `<div class="cards-grid">${filtered.map((r, i) => {
        const origIndex = rows.indexOf(r);
        return `
        <div class="card" onclick="openDetail('faculty', ${origIndex})">
          <div class="card-img">
            ${r.photo ? `<img src="${fixPhotoUrl(r.photo)}" alt="${r.name}" onerror="this.parentElement.innerHTML='👩‍🏫'">` : '👩‍🏫'}
          </div>
          <div class="card-body">
            <div class="card-name">${r.name}</div>
            <div class="card-meta">${r.meta || r.subject || ''}</div>
            <div class="card-desc">${(r.description || r.bio || r.desc || '').substring(0,90)}…</div>
          </div>
        </div>`}).join('')}</div>`
    : `<div class="error-state"><strong>No staff in this category yet.</strong></div>`;

  return catButtons + cards;
}

function showFacultyCategory(category) {
  fetchSheet(TABS['faculty']).then(rows => {
    document.getElementById('section-body').innerHTML = renderFacultyCategories(rows, category);
  });
}

function getDefaultIcon(key) {
  return {donors:'🕊️', sports:'🏆', academics:'🎓', faith:'✝️', faculty:'👩‍🏫', events:'📅', students:'⭐', store:'🛍️'}[key] || '⭐';
}

// ═══════════════════════════════════════════════════════
//  OPEN SECTION
// ═══════════════════════════════════════════════════════
let currentRows = [];
let currentKey = '';

async function openSection(key) {
  const meta = SECTION_META[key];
  document.getElementById('section-title').textContent = meta.title;
  document.getElementById('section-subtitle').textContent = meta.subtitle;
  document.getElementById('section-body').innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <div class="loading-text">Loading ${meta.title}…</div>
    </div>`;
  document.getElementById('home').classList.remove('active');
  document.getElementById('section-screen').classList.add('active');

  try {
    const rows = await fetchSheet(TABS[key]);
    currentRows = rows;
    currentKey = key;

    let html = '';
    if (key === 'donors') html = renderDonors(rows);
    else if (key === 'events') html = renderEvents(rows);
    else if (key === 'faculty') html = renderFacultyCategories(rows);
    else html = renderCards(rows, key);

    document.getElementById('section-body').innerHTML = html;
  } catch(e) {
    document.getElementById('section-body').innerHTML = `
      <div class="error-state">
        <strong>Sheet Not Connected Yet</strong>
        Open the setup guide to connect your Google Sheet.<br><br>
        <span style="font-size:0.7rem;opacity:0.5;">${e.message}</span>
      </div>`;
  }
}

// ═══════════════════════════════════════════════════════
//  DETAIL OVERLAY
// ═══════════════════════════════════════════════════════
function openDetail(key, index) {
  const r = currentRows[index];
  const name = r.name || '';
  const meta = r.meta || r.grade || r.year || r.subject || '';
  const desc = r.description || r.bio || r.desc || '';
  const photo = r.photo || '';
  const verse = r.verse || '"Whatever you do, work at it with all your heart, as working for the Lord." — Colossians 3:23';
  document.getElementById('detail-content').innerHTML = `
    ${photo ? `<img class="detail-img" src="${fixPhotoUrl(photo)}" alt="${name}" onerror="this.style.display='none'">` : `<div class="detail-emoji">${getDefaultIcon(key)}</div>`}
    <div class="detail-name">${name}</div>
    ${meta ? `<div class="detail-badge">${meta}</div>` : ''}
    <div class="detail-body">${desc}</div>
    <div class="detail-verse">${verse}</div>`;
  document.getElementById('detail-overlay').classList.add('open');
}

function closeDetail() { document.getElementById('detail-overlay').classList.remove('open'); }
function goHome() {
  document.getElementById('section-screen').classList.remove('active');
  document.getElementById('home').classList.add('active');
}
document.getElementById('detail-overlay').addEventListener('click', function(e){ if(e.target===this) closeDetail(); });
</script>
</body>
